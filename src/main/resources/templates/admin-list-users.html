<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body>

<!-- TOP NAVBAR -->
<nav class="navbar navbar-dark bg-dark px-3">
    <span class="text-white">
        <b th:text="${#authentication.name}"></b>
        with roles:
        <span th:each="role : ${#authentication.authorities}"
              th:text="${#strings.replace(role.authority,'ROLE_','')} + ' '" th:remove="tag"></span>
    </span>
    <a class="text-white" href="/logout">Logout</a>
</nav>

<div class="container-fluid">
    <div class="row">


        <div class="col-2 bg-light vh-100">
            <ul class="nav flex-column mt-3">
                <li class="nav-item">
                    <a class="nav-link"
                       th:classappend="${activePage == 'admin' ? 'active' : ''}"
                       href="/admin/users/list">
                        Admin
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link"
                       th:classappend="${activePage == 'user' ? 'active' : ''}"
                       href="/user">
                        User
                    </a>
                </li>
            </ul>
        </div>


        <div class="col-10 p-4">
            <h2>Admin Panel</h2>


            <ul class="nav nav-tabs">
                <li class="nav-item">
                    <a class="nav-link active">Users table</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/users/create}">New User</a>
                </li>
            </ul>


            <div class="card mt-3">
                <div class="card-header">All Users</div>
                <div class="card-body">
                    <table class="table table-striped">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>First Name</th>
                            <th>Last Name</th>
                            <th>Age</th>
                            <th>Email</th>
                            <th>Roles</th>
                            <th>Edit</th>
                            <th>Delete</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="user : ${users}">
                            <td th:text="${user.id}"></td>
                            <td th:text="${user.firstName}"></td>
                            <td th:text="${user.lastName}"></td>
                            <td th:text="${user.age}"></td>
                            <td th:text="${user.email}"></td>
                            <td>
                                <span th:each="role : ${user.roles}"
                                      th:text="${#strings.replace(role.name,'ROLE_','')} + ' '" th:remove="tag"></span>
                            </td>
                            <td>
                                <a class="btn btn-info btn-sm"
                                   th:href="@{/admin/users/edit/{id}(id=${user.id})}">Edit</a>
                            </td>
                            <td>
                                <a class="btn btn-danger btn-sm"
                                   th:href="@{/admin/users/delete/{id}(id=${user.id})}">
                                    Delete
                                </a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
